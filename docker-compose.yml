services:
  backend:
    image: ${BACKEND_IMAGE:-ncafe-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yj-dev-backend
    # ports 제거 (내부망 전용으로 변경)
    # - "8065:8081"
    volumes:
      - ./upload:/app/upload
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/ncafedb}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    restart: unless-stopped
    depends_on:
      - db

  frontend:
    image: ${FRONTEND_IMAGE:-ncafe-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yj-dev-frontend
    ports:
      - "3065:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    environment:
      - API_BASE_URL=http://backend:8081
      - AGENT_BASE_URL=http://agent-server:8000
      - SESSION_SECRET=${SESSION_SECRET:-ea78b9775aeded53fdf6ae11a3219db6}
    restart: unless-stopped

  agent-server:
    image: ${AGENT_IMAGE:-ncafe-agent:latest}
    build:
      context: ./agent-server
      dockerfile: Dockerfile
    container_name: yj-dev-agent
    # ports 제거 (내부망 전용으로 변경)
    # - "${AGENT_PORT:-8165}:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - BACKEND_BASE_URL=http://backend:8081
      - POSTGRES_DB=ncafedb
      - POSTGRES_USER=ncafe
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    container_name: yj-dev-db
    environment:
      POSTGRES_DB: ncafedb
      POSTGRES_USER: ncafe
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # ports 제거 (내부망 전용으로 변경)
    # - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped

volumes:
  postgres_data:
