services:
  backend:
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - AGENT_BASE_URL=http://agent-server:8000
      - SPRING_SECURITY_DEBUG=true
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=DEBUG
    ports:
      - "${BACKEND_PORT:-8065}:8081"

  frontend:
    ports:
      - "${FRONTEND_PORT:-3065}:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -lc "npm install && npm run dev -- --port 3001"

  agent-server:
    ports:
      - "${AGENT_PORT:-8165}:8000"

  db:
    ports:
      - "${DB_PORT:-5433}:5432"

volumes:
  frontend_node_modules:
